# ============================================================================
# Self-hosted AI voice assistant stack
#   livekit      - WebRTC media server (self-hosted LiveKit)
#   agent        - LiveKit Agents voice pipeline (ElevenLabs STT/TTS, OpenAI
#                  LLM, MCP tools: Home Assistant + your MCP servers via
#                  MCP_SERVERS_JSON)
#   webtest      - static browser test client (for laptop smoke testing)
#
# Profiles:
#   smoke -> one-shot end-to-end smoke test container
#   tls   -> Caddy reverse proxy for wss:// + https:// (public deployments)
#
# Notes:
#   * Linux host networking is used so WebRTC host candidates work on a LAN
#     without STUN/TURN. On macOS/Windows or for bridge networking see
#     docs/deployment.md.
#   * All configuration comes from .env (see .env.example).
#   * Persistent data (model cache, Caddy certificates/config) defaults to
#     named Docker volumes; set MODEL_CACHE_DIR, CADDY_DATA_DIR and
#     CADDY_CONFIG_DIR in .env to bind-mount specific host folders instead.
# ============================================================================
name: voice-assistant

services:
  livekit:
    image: livekit/livekit-server:v1.9.10
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit/livekit.yaml
    environment:
      # "key: secret" mapping, see https://docs.livekit.io/deploy/custom/deployments/
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Advertised ICE candidate IP (consumed by livekit-server as $NODE_IP).
      # Empty = auto-detect (LAN deployments). Set NODE_IP=127.0.0.1 in .env
      # for remote voice testing via "coder port-forward" (browser on your
      # laptop reaches the tunneled loopback ports).
      NODE_IP: ${NODE_IP:-}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Etc/UTC}
      # ONNX Runtime (silero VAD / turn detector): full telemetry opt-out. The
      # device ID it would otherwise persist under ~/.cache (= the model-cache
      # volume) fails on non-user-owned mounts and logs
      # "Failed to persist telemetry device ID; using an in-memory identifier".
      ORT_DISABLE_TELEMETRY: "1"
    volumes:
      # Model downloads (silero VAD, turn detector) = persistent data.
      # MODEL_CACHE_DIR empty -> named volume "model-cache";
      # set MODEL_CACHE_DIR=/abs/or/./path in .env to bind-mount a host folder.
      - ${MODEL_CACHE_DIR:-model-cache}:/home/agent/.cache
    depends_on:
      - livekit
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  webtest:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_TEST_PORT:-8080}:80"
    volumes:
      - ./tests/web:/usr/share/nginx/html:ro
    profiles: ["web"]

  # One-shot end-to-end smoke test:
  #   docker compose --profile smoke run --rm smoke
  smoke:
    build:
      context: .
      dockerfile: agent/Dockerfile
    network_mode: host
    profiles: ["smoke"]
    env_file: .env
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      TZ: ${TZ:-Etc/UTC}
      # same ONNX Runtime telemetry opt-out as the agent service
      ORT_DISABLE_TELEMETRY: "1"
    volumes:
      # same persistent model cache as the agent (keeps smoke runs fast)
      - ${MODEL_CACHE_DIR:-model-cache}:/home/agent/.cache
    command:
      - python
      - /app/scripts/smoke_test.py
      - --url
      - ${LIVEKIT_URL:-ws://localhost:7880}

  # Optional TLS termination for public deployments (wss://your.domain):
  #   docker compose --profile tls up -d
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      VA_DOMAIN: ${VA_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS certificates and Caddy's own config = persistent data.
      # CADDY_DATA_DIR / CADDY_CONFIG_DIR empty -> named volumes
      # caddy_data / caddy_config; set them in .env to bind-mount host folders.
      - ${CADDY_DATA_DIR:-caddy_data}:/data
      - ${CADDY_CONFIG_DIR:-caddy_config}:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  model-cache:
  caddy_data:
  caddy_config:
